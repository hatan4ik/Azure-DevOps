name: Build Engineering Intelligence Board Deck

on:
  push:
    paths:
      - 'engineering-intelligence-transformation/slides/**'
      - 'engineering-intelligence-transformation/docs/board-deck-narrative.md'
  pull_request:
    paths:
      - 'engineering-intelligence-transformation/slides/**'
      - 'engineering-intelligence-transformation/docs/board-deck-narrative.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engineering-intelligence-transformation/slides

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build PowerPoint
        run: python build_deck.py

      - name: Verify PowerPoint exists
        run: test -s engineering-intelligence-board-deck.pptx

      - name: Upload deck artifact
        uses: actions/upload-artifact@v4
        with:
          name: engineering-intelligence-board-deck
          path: engineering-intelligence-transformation/slides/engineering-intelligence-board-deck.pptx
          if-no-files-found: error
